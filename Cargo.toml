[package]
name = "photo-edit-simplified"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window", "Document", "Element", "HtmlElement", "Node",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData",
  "HtmlImageElement", "HtmlInputElement", "HtmlVideoElement",
  "File", "FileList", "FileReader", "Blob", "BlobPropertyBag", "Url",
  "DragEvent", "DataTransfer", "ClipboardEvent",
  "PointerEvent", "MouseEvent", "TouchEvent",
  "Event", "EventTarget", "ProgressEvent",
  "Navigator", "Storage", "CssStyleDeclaration", "DomRect",
  "FontFace", "FontFaceDescriptors", "FontFaceSet",
] }

console_error_panic_hook = "0.1"

# RAW import (rawler is the pure-Rust decoder from the dnglab project).
# Vendored: upstream calls std::time::Instant::now() in demosaic timing logs,
# which panics on wasm32-unknown-unknown; the vendored copy strips those calls.
rawler = { path = "vendor/rawler" }
# rawler's transitive deps need wasm-aware randomness sources.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
