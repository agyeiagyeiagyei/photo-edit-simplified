name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build pixel worker
        run: |
          WB_VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WB_VERSION}/wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          cargo build -p pixel-worker --release --target wasm32-unknown-unknown
          "./wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" --target web --out-dir public/pixel-worker target/wasm32-unknown-unknown/release/pixel_worker.wasm

      - name: Build
        run: trunk build --release --public-url /photo-edit-simplified/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: cargo test
        run: cargo test --workspace

      - name: Build pixel worker
        run: |
          WB_VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/')
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WB_VERSION}/wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          cargo build -p pixel-worker --release --target wasm32-unknown-unknown
          "./wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" --target web --out-dir public/pixel-worker target/wasm32-unknown-unknown/release/pixel_worker.wasm

      - name: Build (served at /)
        run: trunk build --release --public-url /

      - name: Size budget
        run: ./scripts/size-budget.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install e2e deps
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Install Pillow (fixture generator)
        run: python3 -m pip install --user pillow

      - name: Generate fixtures
        working-directory: tests/e2e
        run: mkdir -p fixtures && python3 gen_fixtures.py fixtures

      - name: Cache RAW fixture
        uses: actions/cache@v4
        with:
          path: dl-raw
          key: raw-fixture-sony-ilce5000-v1

      - name: Fetch RAW fixture (best effort; the RAW spec skips without it)
        continue-on-error: true
        run: |
          mkdir -p dl-raw
          if [ -n "$(ls -A dl-raw)" ]; then echo "cached"; exit 0; fi
          URL=$(curl -fsSL "https://raw.pixls.us/json/getrepository.php?set=all" | python3 -c '
import json, sys
for row in json.load(sys.stdin).get("data", []):
    url = row[7] if isinstance(row, list) and len(row) > 7 else ""
    if "ILCE-5000" in url and "12bit compressed" in url:
        print(url); break
')
          if [ -z "$URL" ]; then echo "no RAW URL in the index"; exit 0; fi
          curl -fL --retry 3 -o "dl-raw/$(basename "$URL")" "$URL"

      - name: Playwright suite
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/e2e/results/metrics.json
            tests/e2e/results/report.json
            tests/e2e/results/html
            tests/e2e/results/artifacts
          if-no-files-found: ignore

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
