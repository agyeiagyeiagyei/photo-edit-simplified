[package]
name = "pixel-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
pes-pixel = { path = "../pixel" }
rawcore = { path = "../rawcore" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData",
] }

# rawler's transitive uuid/getrandom need wasm-aware entropy on wasm32.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
