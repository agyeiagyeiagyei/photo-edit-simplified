<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#111111"/>
  <title>photo-edit-simplified</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" href="icon-192.png"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link data-trunk rel="css" href="style.css"/>
  <link data-trunk rel="copy-file" href="public/manifest.webmanifest"/>
  <link data-trunk rel="copy-file" href="public/sw.js"/>
  <link data-trunk rel="copy-file" href="public/icon-192.png"/>
  <link data-trunk rel="copy-file" href="public/icon-512.png"/>
  <link data-trunk rel="copy-file" href="public/fonts/inter-400.woff2"/>
  <link data-trunk rel="copy-file" href="public/fonts/inter-700.woff2"/>
  <link data-trunk rel="copy-file" href="public/fonts/oswald-400.woff2"/>
  <link data-trunk rel="copy-file" href="public/fonts/oswald-700.woff2"/>
  <link data-trunk rel="copy-dir" href="public/vendor"/>
  <link data-trunk rel="rust" data-wasm-opt="2"/>
  <script src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <script type="module">
    import { FilesetResolver, ImageSegmenter } from "./vendor/mediapipe-tasks-vision/vision_bundle.mjs";
    window.PES = { FilesetResolver, ImageSegmenter };
  </script>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // HEIC -> JPEG blob. Called from Rust.
    window.pesHeicToJpeg = async function (blob) {
      const out = await window.heic2any({ blob, toType: 'image/jpeg', quality: 0.92 });
      return Array.isArray(out) ? out[0] : out;
    };

    // MediaPipe Selfie Segmentation via Tasks Vision ImageSegmenter. Called from Rust.
    let _imageSegmenter = null;
    window.pesSegmentSelfie = async function (image) {
      const { FilesetResolver, ImageSegmenter } = window.PES;
      if (!_imageSegmenter) {
        const vision = await FilesetResolver.forVisionTasks(
          './vendor/mediapipe-tasks-vision/wasm'
        );
        _imageSegmenter = await ImageSegmenter.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              './vendor/mediapipe-selfie-segmenter/selfie_segmenter.tflite',
            delegate: 'GPU',
          },
          runningMode: 'IMAGE',
          outputCategoryMask: true,
        });
      }
      const result = await _imageSegmenter.segment(image);
      const mask = result.categoryMask;
      // categoryMask is 0/1 per pixel; scale to 0..255.
      const data = mask.getAsUint8Array();
      const out = new Uint8Array(data.length);
      for (let i = 0; i < data.length; i++) {
        out[i] = data[i] > 0 ? 255 : 0;
      }
      return out;
    };

    // Video transcode via ffmpeg.wasm. Called from Rust.
    // overlays: [{ name, blob }] extra input files referenced in the filter graph.
    let _ffmpeg = null;
    window.pesVideoTranscode = async function (name, blob, args, overlays, onProgress) {
      try {
        const { createFFmpeg, fetchFile } = FFmpeg;
        if (!_ffmpeg) {
          // Single-threaded core: no SharedArrayBuffer, works on GitHub Pages
          // (no COOP/COEP headers needed).
          _ffmpeg = createFFmpeg({
            log: false,
            corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
            mainName: 'main',
            progress: (p) => onProgress(p.ratio || 0),
          });
          await _ffmpeg.load();
        }
        _ffmpeg.FS('writeFile', name, await fetchFile(blob));
        for (const ov of overlays || []) {
          _ffmpeg.FS('writeFile', ov.name, await fetchFile(ov.blob));
        }
        await _ffmpeg.run(...args);
        const data = _ffmpeg.FS('readFile', 'pes-out.mp4');
        _ffmpeg.FS('unlink', name);
        _ffmpeg.FS('unlink', 'pes-out.mp4');
        for (const ov of overlays || []) {
          _ffmpeg.FS('unlink', ov.name);
        }
        return new Blob([data.buffer], { type: 'video/mp4' });
      } catch (e) {
        console.error('pesVideoTranscode failed:', e && e.message ? e.message : String(e), args);
        throw e;
      }
    };
  </script>
</body>
</html>
