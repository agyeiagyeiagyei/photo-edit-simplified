[package]
name = "photo-edit-simplified"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]
members = ["pixel", "worker", "rawcore", "rawmeta"]

[dependencies]
pes-pixel = { path = "pixel" }
rawmeta = { path = "rawmeta" }
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window", "Document", "Element", "HtmlElement", "Node",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Path2d",
  "HtmlImageElement", "HtmlInputElement", "HtmlVideoElement",
  "File", "FileList", "FileReader", "Blob", "BlobPropertyBag", "Url",
  "DragEvent", "DataTransfer", "ClipboardEvent",
  "PointerEvent", "MouseEvent", "TouchEvent",
  "Event", "EventTarget", "ProgressEvent",
  "Navigator", "Storage", "CssStyleDeclaration", "DomRect",
  "FontFace", "FontFaceDescriptors", "FontFaceSet",
  "Headers", "Request", "RequestInit", "Response",
  "Worker", "WorkerOptions", "WorkerType", "ErrorEvent", "MessageEvent",
  "Performance", "Location",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlTexture", "WebGlUniformLocation", "WebGlFramebuffer",
  "WebGlVertexArrayObject",
] }

console_error_panic_hook = "0.1"

idb = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
