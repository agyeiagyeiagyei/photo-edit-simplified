[package]
name = "rawcore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rawmeta = { path = "../rawmeta" }
# rawler is the pure-Rust decoder from the dnglab project. Vendored: upstream
# calls std::time::Instant::now() in demosaic timing logs, which panics on
# wasm32-unknown-unknown; the vendored copy strips those calls.
rawler = { path = "../vendor/rawler" }

# First-call timing for the worker's perf marks (std::time has no clock on
# wasm32-unknown-unknown). Host tests skip the clock entirely.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
